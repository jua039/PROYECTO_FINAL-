<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale =1.0">
    <title>Contactanos </title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="card" style="width: 100%; max-width: 400px; margin: 0 auto;">
        <div class="card-body">
            <h5 class="card-title text-center mb-4">Contactanos</h5>
            <form id="contactanos">
                <div class="form-group">
                    <label for="exampleInputEmail1">Nombre completo</label>
                    <input type="name" class="form-control" id="nombreCompleto" aria-describedby="emailHelp"
                        placeholder="Ingrese su nombre completo">
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">Correo electronico</label>
                    <input type="password" class="form-control" id="correoElectronico"
                        placeholder="Ingrese su correo electronico">
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="guardarInfo">
                    <label class="form-check-label" for="exampleCheck1">Guardar información</label>
                </div>
                <button type="submit" class="btn btn-primary">Enviar</button>
            </form>
        </div>
    </div>
    <script src="Aleja.js"></script>
</body>

</html>
