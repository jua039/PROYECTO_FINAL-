<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Destinos | Parchemos Travel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/catalogo.css" />
  </head>

  <body data-page="destinos">
    <div id="navbar-root"></div>
    <section class="container py-5">
      <div class="row text-center">
        <div class="col-md-4">
          <h2>35+</h2>
          <p>Destinos</p>
        </div>
        <div class="col-md-4">
          <h2>3</h2>
          <p>Categorias</p>
        </div>
        <div class="col-md-4">
          <h2>500+</h2>
          <p>Viajeros felices</p>
        </div>
      </div>
    </section>

    <main class="container my-5">
      <form id="formBuscarDestino" class="buscador-destinos" role="search">
        <label for="buscarDestino" class="visually-hidden">Buscar un destino</label>
        <i class="bi bi-search buscador-icono" aria-hidden="true"></i>
        <input
          id="buscarDestino"
          class="form-control"
          type="search"
          placeholder="¿A dónde quieres viajar? Busca por destino, ciudad o categoría"
          autocomplete="off"
        />
        <button id="limpiarBusqueda" class="btn limpiar-busqueda d-none" type="button" aria-label="Limpiar búsqueda">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </form>
      <p id="estadoBusqueda" class="estado-busqueda text-center" aria-live="polite"></p>

      <h2 class="text-center section-title">Destinos Para ti</h2>

      
      <div class="filtros-destinos mb-4">
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-3" id="filtrosCategoria">
          <button class="btn btn-filtro active" data-categoria="todos">Todos</button>
          <button class="btn btn-filtro" data-categoria="Naturaleza">Naturaleza</button>
          <button class="btn btn-filtro" data-categoria="Cultural">Cultural</button>
          <button class="btn btn-filtro" data-categoria="Montaña">Montaña</button>
          <button class="btn btn-filtro" data-categoria="Playa">Playa</button>
          <button class="btn btn-filtro" data-categoria="Rural">Rural</button>
        </div>

        <div class="d-flex flex-wrap gap-2 justify-content-center align-items-center">
          <span class="filtro-label"><i class="bi bi-people-fill"></i> Viaja en grupo:</span>
          <button class="btn btn-filtro-grupo active" data-tipo="todos">Todos</button>
          <button class="btn btn-filtro-grupo" data-tipo="Parche individual">Parche individual</button>
          <button class="btn btn-filtro-grupo" data-tipo="Parchemos con amigos">Parchemos con amigos</button>
          <button class="btn btn-filtro-grupo" data-tipo="A viajar en familia">A viajar en familia</button>
        </div>
      </div>

      <div id="listaPublicaDestinos" class="row g-4"></div>

      <div id="sinDestinos" class="text-center d-none py-5">
        <i class="bi bi-inbox text-muted" style="font-size: 3rem"></i>
        <p class="text-muted mt-2">
          No hay destinos disponibles con los filtros seleccionados.
        </p>
      </div>
    </main>

    <div id="footer-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/seed.js"></script>
    <script src="../js/catalogo.js"></script>
    <script src="../js/layout.js" data-base=".."></script>
  </body>
</html>
