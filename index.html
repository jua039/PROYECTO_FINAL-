<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- HEADER -->
    <header class="topbar">
      <button class="icon-btn" aria-label="Cerrar">✕</button>
      <h1 class="brand">DASHBOARD</h1>
      <button class="icon-btn menu-btn" aria-label="Menú">
        <span></span><span></span><span></span>
      </button>
    </header>

    <div class="content">

      <h2 class="section-title">RESUMEN</h2>
      <section class="cards">
        <button class="card" data-section="reservas">
          <span class="card-icon">📝</span>
          <span class="card-label">Reservas</span>
        </button>
        <button class="card" data-section="clientes">
          <span class="card-icon">👥</span>
          <span class="card-label">Clientes</span>
        </button>
        <button class="card" data-section="ingresos">
          <span class="card-icon">💰</span>
          <span class="card-label">Ingresos</span>
        </button>
      </section>

      <section class="stats">
        <h2 class="stats-title">ESTADÍSTICAS</h2>

        <div class="chart-box">
          <h3 class="chart-title">Reserva por Mes</h3>
          <div class="chart-bars" id="chart"></div>
        </div>

        <div class="months">
          <button class="month-btn active" data-month="Ene">Ene</button>
          <button class="month-btn" data-month="Feb">Feb</button>
          <button class="month-btn" data-month="Mar">Mar</button>
          <button class="month-btn" data-month="Abr">Abr</button>
          <button class="month-btn" data-month="May">May</button>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
