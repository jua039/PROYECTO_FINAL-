<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parchemos Travel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/contactenos.css">
</head>

<body data-page="contacto">

    <div id="navbar-root"></div>

    <section class="contacto-hero">
    <div class="card mx-auto shadow" style="max-width: 500px;">
        <h2>Te queremos escuchar</h2>
       <form id="formContacto" action="https://formspree.io/f/xvznjvze" class="fs-form" target="_top" method="POST">
            <div class="fs-field">
                <label class="fs-label" for="name">Parcera/o</label>
                <input class="fs-input" id="name" name="name" type="text" placeholder="Nombre completo" required>
            </div>
            <div class="fs-field">
                <label class="fs-label" for="email">Correo electrónico</label>
                <input class="fs-input" id="email" name="email" type="email" placeholder="nombre@ejemplo.com" required>
            </div>
            <div class="fs-field">
                <label class="fs-label" for="number">Teléfono</label>
                <input class="fs-input" id="number" name="number" type="tel" placeholder="+57 300 123 4567">
            </div>
            <div class="fs-field">
                <label class="fs-label" for="message">Mensaje</label>
                <textarea class="fs-textarea" id="message" name="message"
                    placeholder="Cuéntanos cómo podemos ayudarte..." required></textarea>
            </div>
            <div class="fs-button-group">
                <button class="fs-button" type="submit">Enviar</button>
            </div>
        </form>
        <div id="mensajeContacto" class="alert alert-success mt-3 d-none" role="alert"></div>
    </div>
    </section>

    <div id="footer-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/contactenos.js"></script>
    <script src="../js/layout.js" data-base=".."></script>

</body>

</html>
