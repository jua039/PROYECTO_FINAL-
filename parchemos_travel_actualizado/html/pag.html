<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencias | Parchemos Travel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/experiencias.css">
</head>

<body data-page="experiencias">

    <div id="navbar-root"></div>

    <section class="experiencias-hero">
        <div class="container text-center">
            <span class="hero-badge">BLOG &amp; NOTICIAS</span>
            <h1>Experiencias que inspiran tu próximo parche</h1>
            <p>Historias, consejos y noticias de viajeros que ya recorrieron Colombia con nosotros.</p>
        </div>
    </section>

    <main class="container my-5">

        <!-- Filtro de categorías -->
        <div class="d-flex flex-wrap gap-2 justify-content-center mb-5" id="filtrosBlog">
            <button class="btn btn-filtro active" data-categoria="todos">Todas</button>
            <button class="btn btn-filtro" data-categoria="Aventura">Aventura</button>
            <button class="btn btn-filtro" data-categoria="Gastronomía">Gastronomía</button>
            <button class="btn btn-filtro" data-categoria="Cultura">Cultura</button>
            <button class="btn btn-filtro" data-categoria="Consejos">Consejos de viaje</button>
        </div>

        <!-- Publicación destacada -->
        <div id="postDestacado" class="mb-5"></div>

        <!-- Grid de publicaciones -->
        <div id="listaBlog" class="row g-4"></div>

        <div id="sinPosts" class="text-center d-none py-5">
            <i class="bi bi-journal-x text-muted" style="font-size: 3rem"></i>
            <p class="text-muted mt-2">No hay publicaciones en esta categoría todavía.</p>
        </div>
    </main>

    <div id="footer-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/blog.js"></script>
    <script src="../js/layout.js" data-base=".."></script>

</body>

</html>
