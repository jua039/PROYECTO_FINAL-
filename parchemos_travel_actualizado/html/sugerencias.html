<!DOCTYPE html>
<html lang="es">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sugerencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/sugerencias.css">
</head>
 
<body data-page="contacto">
 
    <div id="navbar-root"></div>
 
 
    <header class="header-contacto">
        <img src="../assets/images/logo.jpeg" alt="Logo_Parchemos" class="hero-logo mb-3">
        <h1>Sugerencias</h1>
        <p>Tu opinión nos ayuda a crear experiencias de viaje inolvidables. Comparte tus sugerencias y ayúdanos a mejorar en cada aventura.</p>
    </header>
   
    <main class="container my-5">
        <div class="row g-4">
           
            <div class="col-md-4">
                <div class="info-contacto h-100">
                    <h2>Información de contacto</h2>
                    <p><strong>Ubicación:</strong> Bogotá, Colombia</p>
                    <p><strong>Teléfono:</strong> +57 322 222 2222</p>
                    <p><strong>Email:</strong> sugerencias@parchemostravel.com</p>
                </div>
            </div>
           
            <div class="col-md-8">
                <div class="contact-form-container">
                    <form id="contactForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Tu nombre">
                            </div>
                            <div class="col-md-6">
                                <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                                <input type="email" id="correo" class="form-control" placeholder="tu@correo.com">
                            </div>
                        </div>
                       
                        <label for="mensaje" class="form-label fw-bold mt-3">Mensaje</label>
                        <textarea id="mensaje" class="form-control" placeholder="¿Cuéntanos tu opinión o Sugerencia?"></textarea>
                       
                        <button type="submit" class="btn-custom mt-4">Enviar Mensaje</button>
                    </form>
                    <div id="mensajeSugerencia" class="alert alert-success mt-3 d-none" role="alert"></div>
                </div>
            </div>
           
        </div>
    </main>
 
    <div id="footer-root"></div>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/sugerencias.js"></script>
    <script src="../js/layout.js" data-base=".."></script>
 
</body>
 
</html>
